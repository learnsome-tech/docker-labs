name: m06l01-stack

services:
  api:
    build: .
    image: taskapi:m06l01
    ports:
      - "18601:8000"
    environment:
      APP_VERSION: 1.1.0
      DATABASE_URL: postgres://tasks:tasks@db:5432/tasks
    volumes:
      - task-data:/data
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: tasks
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  task-data:
  db-data:
