name: m06l03-stack

services:
  api:
    build: .
    image: taskapi:m06l03
    environment:
      APP_VERSION: 1.1.0
      DATABASE_URL: postgres://tasks:tasks@db:5432/tasks
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: tasks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tasks -d tasks"]
      interval: 5s
      start_period: 30s
      start_interval: 1s
