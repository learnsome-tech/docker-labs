apiVersion: v1
kind: Service
metadata: { name: taskapi }
spec:
  selector: { app: taskapi }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: taskapi-config }
data:
  APP_VERSION: "1.0.0"
  DATA_DIR: /data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: task-data }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
