# Docker Architecture & Production Containers — lesson m02l04 — Run The Spine Service And Publish Its Port
# https://learnsome.tech/courses/docker-course/watch?lesson=m02l04
# © LearnSome.tech
services:
  api:
    build: .
    image: taskapi:1.0.0
    ports:
      - "8080:8000"
    environment:
      APP_VERSION: 1.0.0
      DATABASE_URL: postgres://tasks:tasks@db:5432/tasks
    volumes:
      - task-data:/data
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: tasks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks"]
      interval: 3s
      retries: 10

volumes:
  task-data:
