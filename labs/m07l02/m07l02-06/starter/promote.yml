name: promote
on:
  workflow_dispatch:
    inputs:
      sha: { description: "Commit to promote", required: true }
      to: { type: choice, options: [staging, prod] }
jobs:
  promote:
    runs-on: ubuntu-latest
    environment: ${{ inputs.to }}
    permissions: { packages: write }
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          SRC: ghcr.io/example/taskapi:${{ inputs.sha }}
          DST: ghcr.io/example/taskapi:${{ inputs.to }}
        run: docker buildx imagetools create -t "$DST" "$SRC"
